# ============================================================================
# ARGOS / IRIS — routage HTTP de la station (Traefik, fournisseur fichier)
#
# Une origine, cinq chemins. Aucune socket Docker : ce fichier suffit, il se
# relit à chaud. La priorité va du chemin le plus précis au plus large.
#
# Tuiles : le navigateur demande /tiles/{source}/{z}/{x}/{y} (le motif câblé
# dans apps/web/src/lib/map/style.ts) ; chaque source a son routeur, parce que
# tileserver-gl ne les sert pas au même endroit :
#   sat, dem  (MBTiles raster)  → /data/{source}/{z}/{x}/{y}.jpg|png
#   plan, lbl (styles rendus)   → /styles/{source}/{z}/{x}/{y}.png
# ============================================================================
http:
  routers:
    api:
      rule: "PathPrefix(`/api`)"
      entryPoints: [web]
      service: api
      priority: 50
    tiles-sat:
      rule: "PathRegexp(`^/tiles/sat/[0-9]+/[0-9]+/[0-9]+$`)"
      entryPoints: [web]
      service: tiles
      middlewares: [tiles-sat]
      priority: 60
    tiles-dem:
      rule: "PathRegexp(`^/tiles/dem/[0-9]+/[0-9]+/[0-9]+$`)"
      entryPoints: [web]
      service: tiles
      middlewares: [tiles-dem]
      priority: 60
    tiles-plan:
      rule: "PathRegexp(`^/tiles/plan/[0-9]+/[0-9]+/[0-9]+$`)"
      entryPoints: [web]
      service: tiles
      middlewares: [tiles-plan]
      priority: 60
    tiles-lbl:
      rule: "PathRegexp(`^/tiles/lbl/[0-9]+/[0-9]+/[0-9]+$`)"
      entryPoints: [web]
      service: tiles
      middlewares: [tiles-lbl]
      priority: 60
    # Le reste de tileserver-gl (catalogue, TileJSON, aperçu) — utile pour vérifier.
    tiles-admin:
      rule: "PathPrefix(`/tiles`)"
      entryPoints: [web]
      service: tiles
      middlewares: [strip-tiles]
      priority: 50
    routing:
      rule: "PathPrefix(`/routing`)"
      entryPoints: [web]
      service: routing
      middlewares: [strip-routing]
      priority: 50
    llm:
      rule: "PathPrefix(`/llm`)"
      entryPoints: [web]
      service: llm
      middlewares: [strip-llm, llm-origin]
      priority: 50
    web:
      rule: "PathPrefix(`/`)"
      entryPoints: [web]
      service: web
      priority: 10

  middlewares:
    tiles-sat:
      replacePathRegex:
        regex: "^/tiles/sat/([0-9]+)/([0-9]+)/([0-9]+)$"
        replacement: "/data/sat/$1/$2/$3.jpg"
    tiles-dem:
      replacePathRegex:
        regex: "^/tiles/dem/([0-9]+)/([0-9]+)/([0-9]+)$"
        replacement: "/data/dem/$1/$2/$3.png"
    tiles-plan:
      replacePathRegex:
        regex: "^/tiles/plan/([0-9]+)/([0-9]+)/([0-9]+)$"
        replacement: "/styles/plan/$1/$2/$3.png"
    tiles-lbl:
      replacePathRegex:
        regex: "^/tiles/lbl/([0-9]+)/([0-9]+)/([0-9]+)$"
        replacement: "/styles/lbl/$1/$2/$3.png"
    strip-tiles:
      stripPrefix:
        prefixes: ["/tiles"]
    strip-routing:
      stripPrefix:
        prefixes: ["/routing"]
    strip-llm:
      stripPrefix:
        prefixes: ["/llm"]
    # Ollama n'accepte que des origines locales : le proxy présente la sienne.
    llm-origin:
      headers:
        customRequestHeaders:
          Origin: "http://localhost"

  services:
    web:
      loadBalancer:
        servers: [{ url: "http://web:3004" }]
    api:
      loadBalancer:
        servers: [{ url: "http://api:3005" }]
        # Flux SSE (/api/realtime/stream) et longues réponses : relayés au fil
        # de l'eau, sans mise en tampon.
        responseForwarding:
          flushInterval: "50ms"
    tiles:
      loadBalancer:
        servers: [{ url: "http://tiles:8080" }]
    routing:
      loadBalancer:
        servers: [{ url: "http://routing:8002" }]
    llm:
      loadBalancer:
        servers: [{ url: "http://host.docker.internal:11434" }]
        responseForwarding:
          flushInterval: "50ms"
